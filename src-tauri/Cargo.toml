[package]
name = "senritsu"
version = "0.2.2"
description = "Customizable, ad-free native YouTube Music and video client for Linux"
edition = "2021"
license = "MIT"
repository = "https://github.com/Imainigination/Senritsu"
homepage = "https://github.com/Imainigination/Senritsu"
keywords = ["music", "youtube", "tauri", "linux"]
categories = ["multimedia::audio"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
